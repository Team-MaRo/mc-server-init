name: Build

# Per-arch native build of the init via Nix. On pushes/PRs it's a smoke build;
# on a release tag (cut by release.yml) it attaches portable Linux binaries to
# the GitHub Release.
#
# The init is Linux-only (fork + openpty + signalfd + PID-1 reaping), so the
# matrix is just x86_64 + aarch64 on native runners — no cross, no emulation.

on:
  push:
    branches: [master]
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach assets to the release on tag builds
  id-token: write # provenance attestation
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            nix_system: x86_64-linux
            interpreter: /lib64/ld-linux-x86-64.so.2
          - arch: arm64
            runner: ubuntu-24.04-arm
            nix_system: aarch64-linux
            interpreter: /lib/ld-linux-aarch64.so.1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/flake.lock', '**/Cargo.lock', '**/flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.arch }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.arch }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Build with Nix
        run: nix build --print-build-logs ".#packages.${{ matrix.nix_system }}.default"

      - name: Make a portable binary
        env:
          ASSET: mc-server-init-linux-${{ matrix.arch }}
          INTERP: ${{ matrix.interpreter }}
        run: |
          set -euo pipefail
          install -m755 result/bin/mc-server-init "$ASSET"
          # A nix-built binary hardcodes the /nix/store ELF interpreter + rpath.
          # Repoint to the system loader and drop the rpath so it runs on any
          # host providing the glibc symbols it actually uses (only GLIBC_2.34).
          nix run nixpkgs#patchelf -- --set-interpreter "$INTERP" --remove-rpath "$ASSET"

      - name: Smoke test
        env:
          ASSET: mc-server-init-linux-${{ matrix.arch }}
        run: |
          set -uo pipefail
          out=$(./"$ASSET" 2>&1); code=$?
          echo "$out"
          # With no program argument it prints usage and exits 2.
          test "$code" = 2 || { echo "::error::unexpected exit $code"; exit 1; }
          echo "$out" | grep -q "usage:" || { echo "::error::no usage output"; exit 1; }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: mc-server-init-linux-${{ matrix.arch }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mc-server-init-linux-${{ matrix.arch }}
          path: mc-server-init-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

      - name: Attach binary to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "mc-server-init-linux-${{ matrix.arch }}" --clobber
